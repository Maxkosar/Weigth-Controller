<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitControl PWA</title>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitControl">

    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-purple: #c084fc;
            --accent-red: #f87171;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 12px 0 20px 0;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-blue);
            color: #0f172a;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        button:active {
            opacity: 0.8;
        }

        button.btn-secondary {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-val {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-top: 2px;
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }

        .logs-list {
            max-height: 220px;
            overflow-y: auto;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.88rem;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-date {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .log-weight {
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 1rem;
            cursor: pointer;
            width: auto;
            padding: 0 8px;
            margin: 0;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-green { background: rgba(74, 222, 128, 0.15); color: var(--accent-green); }
        .badge-red { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); }

        details summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.9rem;
            outline: none;
            user-select: none;
        }

        details[open] summary {
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FitControl</h1>
        <p>Seguimiento Teórico vs. Real</p>
    </header>

    <!-- METRICAS CLAVE -->
    <div class="grid-3" style="margin-bottom: 16px;">
        <div class="stat-card">
            <label>Promedio (7d)</label>
            <div class="stat-val" id="statAvg">-- kg</div>
        </div>
        <div class="stat-card">
            <label>vs. Teórico</label>
            <div class="stat-val" id="statDelta">--</div>
        </div>
        <div class="stat-card">
            <label>Meta Final</label>
            <div class="stat-val" id="statTarget" style="color: var(--accent-purple);">-- kg</div>
        </div>
    </div>

    <!-- GRAFICO -->
    <div class="card">
        <div class="card-title">
            <span>Progreso</span>
            <span id="planStatus" class="badge badge-green">En Plan</span>
        </div>
        <div class="chart-container">
            <canvas id="weightChart"></canvas>
        </div>
    </div>

    <!-- REGISTRAR PESO -->
    <div class="card">
        <div class="card-title">Nuevo Pesaje</div>
        <form id="weightForm">
            <div class="grid-2">
                <div class="form-group">
                    <label for="inputWeight">Peso (kg)</label>
                    <input type="number" id="inputWeight" step="0.1" placeholder="Ej: 92.5" required>
                </div>
                <div class="form-group">
                    <label for="inputDateTime">Fecha y Hora</label>
                    <input type="datetime-local" id="inputDateTime" required>
                </div>
            </div>
            <button type="submit">Guardar Pesaje</button>
        </form>
    </div>

    <!-- CONFIGURAR PLAN TEORICO -->
    <div class="card">
        <details id="configDetails">
            <summary>Configurar Plan / Meta Teórica</summary>
            <form id="configForm" style="margin-top: 12px;">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="cfgStartWeight">Peso Inicial (kg)</label>
                        <input type="number" id="cfgStartWeight" step="0.1" value="93" required>
                    </div>
                    <div class="form-group">
                        <label for="cfgTargetWeight">Peso Meta (kg)</label>
                        <input type="number" id="cfgTargetWeight" step="0.1" value="79" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="cfgStartDate">Fecha de Inicio</label>
                        <input type="date" id="cfgStartDate" required>
                    </div>
                    <div class="form-group">
                        <label for="cfgDeficit">Pérdida Semanal</label>
                        <select id="cfgDeficit">
                            <option value="0.5">0.5 kg / sem (500 kcal/d)</option>
                            <option value="0.75" selected>0.75 kg / sem (750 kcal/d)</option>
                            <option value="1.0">1.0 kg / sem (1000 kcal/d)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-secondary">Actualizar Meta Teórica</button>
            </form>
        </details>
    </div>

    <!-- HISTORIAL -->
    <div class="card">
        <div class="card-title">Historial de Pesajes</div>
        <div class="logs-list" id="logsList">
            <!-- Render dinámico -->
        </div>
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Estado inicial / LocalStorage
        let config = JSON.parse(localStorage.getItem('fit_config')) || {
            startWeight: 93.0,
            targetWeight: 79.0,
            startDate: new Date().toISOString().split('T')[0],
            weeklyLoss: 0.75
        };

        let logs = JSON.parse(localStorage.getItem('fit_logs')) || [];

        // Inicializar Inputs de Config
        document.getElementById('cfgStartWeight').value = config.startWeight;
        document.getElementById('cfgTargetWeight').value = config.targetWeight;
        document.getElementById('cfgStartDate').value = config.startDate;
        document.getElementById('cfgDeficit').value = config.weeklyLoss;

        // Setear Fecha/Hora actual en el formulario
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('inputDateTime').value = now.toISOString().slice(0, 16);

        // Chart.js Setup
        const ctx = document.getElementById('weightChart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Teórico (Ideal)',
                        borderColor: '#38bdf8',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        data: [],
                        fill: false
                    },
                    {
                        label: 'Real (Pesajes)',
                        borderColor: '#4ade80',
                        backgroundColor: 'rgba(74, 222, 128, 0.1)',
                        borderWidth: 3,
                        pointRadius: 4,
                        pointBackgroundColor: '#4ade80',
                        data: [],
                        tension: 0.2
                    },
                    {
                        label: 'Promedio 7D',
                        borderColor: '#c084fc',
                        borderWidth: 2,
                        pointRadius: 0,
                        data: [],
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: { unit: 'day', displayFormats: { day: 'dd MMM' } },
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc', boxWidth: 12 } }
                }
            }
        });

        function calculateTheoreticalData() {
            const start = new Date(config.startDate);
            const totalKgToLose = config.startWeight - config.targetWeight;
            const weeksNeeded = totalKgToLose / config.weeklyLoss;
            const daysNeeded = Math.ceil(weeksNeeded * 7);
            
            const endDate = new Date(start);
            endDate.setDate(endDate.getDate() + daysNeeded);

            return [
                { x: start.toISOString(), y: Number(config.startWeight) },
                { x: endDate.toISOString(), y: Number(config.targetWeight) }
            ];
        }

        function calculateMovingAverage(sortedLogs) {
            const maData = [];
            for (let i = 0; i < sortedLogs.length; i++) {
                const currentDate = new Date(sortedLogs[i].dateTime);
                const sevenDaysAgo = new Date(currentDate);
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

                const windowLogs = sortedLogs.filter(l => {
                    const d = new Date(l.dateTime);
                    return d >= sevenDaysAgo && d <= currentDate;
                });

                const sum = windowLogs.reduce((acc, curr) => acc + curr.weight, 0);
                const avg = sum / windowLogs.length;

                maData.push({ x: sortedLogs[i].dateTime, y: Number(avg.toFixed(2)) });
            }
            return maData;
        }

        function updateApp() {
            // Ordenar logs por fecha
            logs.sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

            // Actualizar Gráfico
            const theoretical = calculateTheoreticalData();
            const realData = logs.map(l => ({ x: l.dateTime, y: l.weight }));
            const maData = calculateMovingAverage(logs);

            chart.data.datasets[0].data = theoretical;
            chart.data.datasets[1].data = realData;
            chart.data.datasets[2].data = maData;
            chart.update();

            // Actualizar Métricas
            document.getElementById('statTarget').innerText = `${config.targetWeight} kg`;

            if (logs.length > 0) {
                const last7DaysLogs = logs.filter(l => {
                    const d = new Date(l.dateTime);
                    const now = new Date();
                    return (now - d) <= (7 * 24 * 60 * 60 * 1000);
                });

                const avg7d = last7DaysLogs.length > 0 
                    ? (last7DaysLogs.reduce((a, b) => a + b.weight, 0) / last7DaysLogs.length).toFixed(1)
                    : logs[logs.length - 1].weight.toFixed(1);

                document.getElementById('statAvg').innerText = `${avg7d} kg`;

                // Calcular Delta contra Teórico
                const latestLog = logs[logs.length - 1];
                const latestDate = new Date(latestLog.dateTime);
                const startDate = new Date(config.startDate);
                const daysElapsed = Math.max(0, (latestDate - startDate) / (1000 * 60 * 60 * 24));
                const expectedWeight = config.startWeight - (daysElapsed * (config.weeklyLoss / 7));
                const delta = (latestLog.weight - expectedWeight).toFixed(1);

                const statDelta = document.getElementById('statDelta');
                const planStatus = document.getElementById('planStatus');

                if (delta <= 0) {
                    statDelta.innerText = `${delta} kg`;
                    statDelta.style.color = '#4ade80';
                    planStatus.innerText = 'En Plan';
                    planStatus.className = 'badge badge-green';
                } else {
                    statDelta.innerText = `+${delta} kg`;
                    statDelta.style.color = '#f87171';
                    planStatus.innerText = 'Desviado';
                    planStatus.className = 'badge badge-red';
                }
            }

            // Render Historial
            const logsList = document.getElementById('logsList');
            logsList.innerHTML = '';
            [...logs].reverse().forEach((log) => {
                const dateObj = new Date(log.dateTime);
                const formattedDate = dateObj.toLocaleDateString('es-AR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <div>
                        <div class="log-weight">${log.weight.toFixed(1)} kg</div>
                        <div class="log-date">${formattedDate}</div>
                    </div>
                    <button class="btn-del" onclick="deleteLog('${log.id}')">✕</button>
                `;
                logsList.appendChild(item);
            });

            // Guardar en LocalStorage
            localStorage.setItem('fit_config', JSON.stringify(config));
            localStorage.setItem('fit_logs', JSON.stringify(logs));
        }

        // Handlers de Formularios
        document.getElementById('weightForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('inputWeight').value);
            const dateTime = document.getElementById('inputDateTime').value;

            logs.push({
                id: Date.now().toString(),
                weight: weight,
                dateTime: dateTime
            });

            document.getElementById('inputWeight').value = '';
            updateApp();
        });

        document.getElementById('configForm').addEventListener('submit', (e) => {
            e.preventDefault();
            config.startWeight = parseFloat(document.getElementById('cfgStartWeight').value);
            config.targetWeight = parseFloat(document.getElementById('cfgTargetWeight').value);
            config.startDate = document.getElementById('cfgStartDate').value;
            config.weeklyLoss = parseFloat(document.getElementById('cfgDeficit').value);
            
            document.getElementById('configDetails').removeAttribute('open');
            updateApp();
        });

        window.deleteLog = function(id) {
            logs = logs.filter(l => l.id !== id);
            updateApp();
        };

        // Render Inicial
        updateApp();
    </script>
</body>
</html>
